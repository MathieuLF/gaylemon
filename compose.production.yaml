name: gaylemon

services:
  web:
    build:
      context: .
      args:
        GAYLEMON_VERSION: ${GAYLEMON_VERSION:-}
        GAYLEMON_COMMIT: ${GAYLEMON_COMMIT:-unknown}
        GAYLEMON_CHANNEL: ${GAYLEMON_CHANNEL:-production}
    restart: unless-stopped
    labels:
      dockpanel.managed: "true"
      dockpanel.app.template: compose
      dockpanel.app.management: external-compose
      dockpanel.app.environment: production
      dockpanel.app.primary: "true"
      dockpanel.app.domain: gaylemon.nethercore.dev
      nethercore.runtime.contract: compose-v1
      nethercore.service: gaylemon
      nethercore.component: application
      nethercore.backup.required-volumes: ""
      nethercore.backup.excluded-volumes: ""
    environment:
      GAYLEMON_DATABASE_URL: ${GAYLEMON_DATABASE_URL:?GAYLEMON_DATABASE_URL requis}
      GAYLEMON_AGENT_PUBLIC_KEYS: ${GAYLEMON_AGENT_PUBLIC_KEYS:?GAYLEMON_AGENT_PUBLIC_KEYS requis}
      GAYLEMON_PUBLIC_BASE_URL: https://gaylemon.nethercore.dev
      GAYLEMON_LEGACY_HOSTS: gaylemon.mathieu.pro,www.gaylemon.nethercore.dev
      GAYLEMON_GITHUB_CLIENT_ID: ${GAYLEMON_GITHUB_CLIENT_ID:?GAYLEMON_GITHUB_CLIENT_ID requis}
      GAYLEMON_GITHUB_CLIENT_SECRET: ${GAYLEMON_GITHUB_CLIENT_SECRET:?GAYLEMON_GITHUB_CLIENT_SECRET requis}
      GAYLEMON_GITHUB_ALLOWED_USER_ID: "753560"
      GOMEMLIMIT: 192MiB
      GOGC: "75"
    ports:
      - "127.0.0.1:${GAYLEMON_WEB_PORT:-18081}:8080"
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M

networks:
  private:
    internal: false
