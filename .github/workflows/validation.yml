name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: gaylemon-validation
          POSTGRES_DB: gaylemon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaylemon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GOFLAGS: -mod=mod
      GAYLEMON_TEST_DATABASE_URL: postgresql://postgres:gaylemon-validation@127.0.0.1:5432/gaylemon?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tests Go
        run: go test ./...
      - name: PostgreSQL 16
        run: go test -tags=integration ./internal/store -run TestPostgresIngestionLifecycle -v
      - name: Analyse Go
        run: go vet ./...
      - name: Tests du portail
        run: node --test portal/tests/portal-v6-static.test.mjs
      - name: Tests des collecteurs actuels
        run: python -m unittest discover -s server/tests -p 'test_*.py'
      - name: Validation Bash
        run: find server -type f \( -name '*.sh' -o -path 'server/sbin/*' \) -print0 | xargs -0 -r bash -n
      - name: Image de production
        run: docker build --tag gaylemon-web:validation .
